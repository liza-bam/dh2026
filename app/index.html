<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Hub: proof of concept</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Same colours as the diagrams: teal for our agents, yellow top bar for Digital Hub cards, purple for the Teams-like frame */
:root{--ink:#223640;--teal:#2c6e7e;--tint:#e3eef1;--hair:#dce4e7;--second:#3f5f6b;--hub:#f5c000;--live:#d9733b;--frame:#5b5fc7}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#eef3f4;color:var(--ink);font:400 15px/1.5 Inter,sans-serif}
.wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px 12px;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#f5f5f5;border:10px solid #1d1d1f;border-radius:36px;overflow:hidden}
.top{background:var(--frame);color:#fff;padding:12px 16px}
.top b{display:block;font-size:17px}
.top small{opacity:.85;font-size:12px}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--hair)}
.msg .who{display:block;font-size:12px;font-weight:600;color:var(--second)}
.msg.me{align-self:flex-end;background:#e8e9fb;border-color:#d0d2f5}
.msg.live{border-color:var(--live)}
.note{align-self:center;font-size:12px;color:var(--second);text-align:center}
.card{max-width:88%;background:#fff;border:1px solid var(--hair);border-top:6px solid var(--hub);border-radius:10px;padding:10px 12px}
.card.live{border-top-color:var(--live)}
.card b{display:block}
.card p{margin:2px 0;color:var(--second);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{font:600 14px Inter,sans-serif;min-height:40px;padding:0 14px;border-radius:8px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}
button.main{background:var(--teal);color:#fff}
button:disabled{opacity:.45;cursor:default}
.mod{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;color:#fff;background:var(--teal);border-radius:10px;padding:2px 8px}
.typing{align-self:flex-start;font-size:13px;color:var(--second)}
.compose{display:flex;flex-direction:column;gap:6px;padding:8px;border-top:1px solid var(--hair);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;font-weight:400;font-size:13px;border-color:var(--frame);color:var(--frame)}
.row{display:flex;gap:6px}
.row input{flex:1;font:16px Inter,sans-serif;padding:8px 10px;border:1px solid var(--hair);border-radius:8px}
.row button{background:var(--frame);border-color:var(--frame);color:#fff}
.log{width:360px;max-width:100%;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:16px}
.log h2{font-size:16px;margin:0 0 4px}
.log .hint{font-size:13px;color:var(--second);margin:0 0 12px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{font-size:13px;border-left:4px solid var(--hair);padding:2px 0 2px 8px}
.log li b{display:block;font-size:12px}
.log li.agent{border-color:var(--teal)}.log li.agent b{color:var(--teal)}
.log li.live{border-color:var(--live)}
.log li.done{border-color:#3d8b2f}
.restart{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <section class="phone" aria-label="Digital Hub chat">
    <header class="top"><b id="device">Digital Hub in Teams, on the laptop</b><small>Concept mock-up. Not Microsoft Teams.</small></header>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="compose">
      <div class="chips" id="chips"></div>
      <form class="row" id="form"><input id="input" placeholder="Write to Digital Hub" autocomplete="off"><button>Send</button></form>
    </div>
  </section>
  <aside class="log">
    <h2>Behind the scenes</h2>
    <p class="hint">Which agent acts, which system it uses. The employee never sees this.</p>
    <ol id="log"></ol>
    <button class="restart" id="restart">Start again</button>
  </aside>
</div>
<script>
{
const chat = document.getElementById('chat'), log = document.getElementById('log'), chipsEl = document.getElementById('chips');
const form = document.getElementById('form'), input = document.getElementById('input');
const wait = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const add = e => { chat.append(e); chat.scrollTop = chat.scrollHeight; return e; };
let onSend = null;

// What the employee sees ---------------------------------------------------------------
const me = text => add(el('div', 'msg me', text));
const note = text => add(el('div', 'note', text));
async function say(text, who = 'Digital Hub', live = false) {
  const t = add(el('div', 'typing', who + ' is typing…'));
  await wait(900);
  t.remove();
  const m = el('div', 'msg' + (live ? ' live' : ''));
  m.append(el('span', 'who', who), text);
  add(m);
}
// A card: title, lines, buttons. Resolves with the label the employee tapped.
function card(module, title, lines, buttons, live = false) {
  return new Promise(resolve => {
    const c = el('div', 'card' + (live ? ' live' : ''));
    c.append(el('b', '', title), ...lines.map(l => el('p', '', l)));
    const b = el('div', 'btns');
    buttons.forEach((label, i) => {
      const x = el('button', i ? '' : 'main', label);
      x.onclick = () => { b.querySelectorAll('button').forEach(y => y.disabled = true); me(label); resolve(label); };
      b.append(x);
    });
    if (buttons.length) c.append(b);
    if (module) c.append(el('span', 'mod', module));
    add(c);
  });
}
// The employee writes: suggestion chips plus free text. Resolves with what was sent.
function ask(suggestions) {
  chipsEl.replaceChildren(...suggestions.map(s => { const b = el('button', '', s); b.onclick = () => send(s); return b; }));
  return new Promise(resolve => { onSend = resolve; });
}
function send(text) {
  if (!onSend || !text.trim()) return;
  me(text);
  chipsEl.replaceChildren();
  input.value = '';
  const r = onSend; onSend = null; r(text);
}
form.onsubmit = e => { e.preventDefault(); send(input.value); };

// Behind the scenes ----------------------------------------------------------------------
function step(who, text, kind = 'agent') {
  const li = el('li', kind);
  li.append(el('b', '', who), text);
  log.append(li);
}

// Modules: the same task always looks the same ---------------------------------------------
const modules = {
  async installSoftware(app) {
    step('Fix agent', `Checks in ServiceNow that ${app} is approved for this role`);
    const a = await card('Install software', `${app} is approved for you`, ['About 5 minutes'], ['Install now', 'Later']);
    if (a === 'Later') { await say('OK. I will remind you in an hour.'); return 'later'; }
    step('Intune', `Starts the ${app} install`, 'system');
    await say(`Installing ${app}. I will tell you when it is ready.`);
    return 'started';
  },
  async confirmRisky(title, lines, action) {
    for (;;) {
      const a = await card('Confirm a risky action', title, lines, [action, 'Not now']);
      if (a === action) return true;
      await say('OK, I will not touch anything. The install cannot finish without it.');
    }
  },
  async runFix(n, what) {
    step('Fix agent', `Fix ${n}: ${what}`);
    await say(`Fix ${n}: ${what}…`);
    await wait(1200);
  },
  async handOver(person) {
    step('Front door agent', 'Hands over: who, what happened, what was tried, the logs', 'agent');
    step(person, 'Gets the handoff card. No need to ask again.', 'live');
    await wait(800);
    note(`${person} from IT joined the chat`);
    const a = await card('Hand over to a person', `${person} from IT joined`, ['She already knows what happened'], ['Allow remote session'], true);
    step(person, 'Remote session allowed. Fixing it.', 'live');
    return a;
  },
  async continueElsewhere() {
    document.getElementById('device').textContent = 'Digital Hub in Teams, on the phone';
    note('You opened Teams on your phone. Same conversation.');
    step('Front door agent', 'Same conversation on the phone: nothing is asked again');
  },
  async feedback() {
    const a = await card('Feedback', 'How did we do?', [], ['Great', 'OK', 'Not good']);
    step('ServiceNow', `Case closed. Rating: ${a}`, 'system');
    await say('Thank you. The case is closed.');
  },
};

// Scenario 10: failed software install -------------------------------------------------------
async function failedInstall() {
  chat.replaceChildren(); log.replaceChildren();
  document.getElementById('device').textContent = 'Digital Hub in Teams, on the laptop';
  note('Digital Hub');
  await ask(['I need Visio for a client call today']);
  step('Front door agent', 'Loads his context from Workday, Nexthink and ServiceNow: role, laptop, open tickets');
  step('Front door agent', 'Software request: routes to the fix agent');
  if (await modules.installSoftware('Visio') === 'later') return;

  await wait(1500);
  step('Nexthink', 'The install failed: the disk is almost full', 'system');
  await say('The install stopped: your disk is almost full.');
  await modules.confirmRisky('Free up space first?', ['Removes temporary files only', 'Your files stay'], 'Free up space');
  await modules.runFix(1, 'clearing temporary files and installing again');
  step('Intune', 'Fails again', 'system');
  await say('It failed again. I am trying another fix.');

  const reply = await ask(['My call is in 20 minutes, can someone help?', 'OK, keep trying']);
  const frustrated = reply !== 'OK, keep trying';
  if (frustrated) {
    step('Front door agent', 'He is in a hurry: a person takes over now');
  } else {
    await modules.runFix(2, 'repairing the installer and installing again');
    step('Intune', 'Still fails', 'system');
    step('Front door agent', 'Two fixes failed: a person takes over');
  }
  await say('I am bringing in a person from IT. You will not need to explain anything.');
  await modules.handOver('Tracy');
  await say('I am in. Give me two minutes.', 'Tracy', true);

  await ask(['I have to run to the train']);
  await say('Go. Keep this chat open on your phone, I will finish here.', 'Tracy', true);
  await modules.continueElsewhere();
  await wait(1500);
  step('Tracy', 'Fixed in the remote session: the installer cache was broken', 'live');
  await say('Visio is installed on your laptop. Good luck with the call.', 'Tracy', true);
  step('Fix agent', 'Drafts a new fix: check the disk and clear the installer cache before installing');
  step('Engineer', 'Approves the new fix. Next time it runs automatically.', 'done');
  await modules.feedback();
}

document.getElementById('restart').onclick = () => location.reload();
failedInstall();
}
</script>
</body>
</html>
